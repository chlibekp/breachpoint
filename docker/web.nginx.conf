# Static server for the browser build (spec 14.5). Long-cache hashed assets, gzip,
# correct wasm MIME type, and COOP/COEP for the threaded build path.
server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/wasm application/javascript application/octet-stream text/css;
  gzip_min_length 1024;

  types { application/wasm wasm; }

  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location /threaded/ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cache-Control "no-cache";
  }
}
