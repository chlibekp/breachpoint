<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- BREACHPOINT branded loading shell (spec §3: branded loading screen with a real progress bar).
		     Based on Godot's full-size.html (MIT). Font file is copied next to index.html by tools/export.sh. -->
		<style>
@font-face { font-family: 'BP Head'; src: url('chakrapetch-bold.ttf') format('truetype'); font-display: swap; }
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #ECE8E1; background-color: #0F1923; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status {
	position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
	visibility: hidden; font-family: 'BP Head', 'Rajdhani', 'Segoe UI', Arial, sans-serif;
	background:
		radial-gradient(60vmax 40vmax at 88% 10%, rgba(140, 66, 51, 0.55), transparent 70%),
		radial-gradient(50vmax 35vmax at 10% 95%, rgba(107, 63, 214, 0.35), transparent 70%),
		linear-gradient(160deg, #1A3344 0%, #0F1923 60%);
}
#bp-kicker { color: #FF4655; letter-spacing: 0.35em; font-size: 14px; margin-bottom: 10px; }
#bp-title { font-size: clamp(44px, 8vw, 104px); letter-spacing: 0.12em; line-height: 1; }
#bp-bar { width: 140px; height: 6px; background: #FF4655; margin: 18px 0 48px; align-self: center; }
#bp-progress-wrap { width: min(560px, 70vw); }
#bp-progress { position: relative; height: 4px; background: rgba(236, 232, 225, 0.14); overflow: hidden; }
#bp-progress-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #3FE0D0; transition: width 120ms ease-out; }
#bp-progress.indeterminate #bp-progress-fill { width: 30%; animation: bp-sweep 1.1s ease-in-out infinite; }
@keyframes bp-sweep { from { left: -30%; } to { left: 100%; } }
#bp-progress-label { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; letter-spacing: 0.2em; color: rgba(236, 232, 225, 0.6); }
#status-notice {
	display: none; background-color: rgba(15, 25, 35, 0.92); border: 1px solid #FF4655; color: #ECE8E1;
	font-family: system-ui, sans-serif; line-height: 1.4; margin: 24px 2rem 0; padding: 1rem 1.25rem; text-align: center; max-width: 640px;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Your browser does not support JavaScript.</noscript>
		<div id="status">
			<div id="bp-kicker">PRISM TASK FORCE</div>
			<div id="bp-title">BREACHPOINT</div>
			<div id="bp-bar"></div>
			<div id="bp-progress-wrap">
				<div id="bp-progress" class="indeterminate"><div id="bp-progress-fill"></div></div>
				<div id="bp-progress-label"><span id="bp-progress-text">LOADING</span><span id="bp-progress-pct"></span></div>
			</div>
			<div id="status-notice"></div>
		</div>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const progress = document.getElementById('bp-progress');
	const progressFill = document.getElementById('bp-progress-fill');
	const progressText = document.getElementById('bp-progress-text');
	const progressPct = document.getElementById('bp-progress-pct');
	const progressWrap = document.getElementById('bp-progress-wrap');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		progressWrap.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		statusNotice.textContent = '';
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		setStatusNotice(err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.'));
		setStatusMode('notice');
		initializing = false;
	}

	function formatMB(bytes) {
		return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let reg;
			try { reg = navigator.serviceWorker.getRegistration(); } catch (err) { reg = Promise.reject(new Error('Service worker registration failed.')); }
			Promise.race([
				reg.then((r) => (r != null ? Promise.reject(new Error('Service worker already exists.')) : r)).then(() => engine.installServiceWorker()),
				new Promise((resolve) => { setTimeout(() => resolve(), 2000); }),
			]).then(() => { window.location.reload(); }).catch((err) => { console.error('Error while registering service worker:', err); });
		} else {
			displayFailureNotice('BREACHPOINT needs a browser feature that is missing:\n' + missing.join('\n') + '\nUse the latest Chrome, Edge or Firefox on desktop.');
		}
	} else {
		setStatusMode('progress');
		const t0 = performance.now();
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					progress.classList.remove('indeterminate');
					const pct = Math.min(100, (current / total) * 100);
					progressFill.style.width = pct.toFixed(1) + '%';
					progressText.textContent = 'DOWNLOADING  ' + formatMB(current) + ' / ' + formatMB(total);
					progressPct.textContent = Math.floor(pct) + '%';
					if (current >= total) progressText.textContent = 'STARTING ENGINE';
				} else {
					progress.classList.add('indeterminate');
				}
			},
		}).then(() => {
			window.bpLoadSeconds = (performance.now() - t0) / 1000;
			console.log('[BREACHPOINT] engine started in ' + window.bpLoadSeconds.toFixed(2) + ' s');
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
