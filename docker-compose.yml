# Local development stack (spec 14.5). Postgres/Redis are provisioned now so services in
# milestone 8 can attach; the gateway is the only Node service so far.
services:
  gateway:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports: ["7350:7350"]
    environment:
      PORT: "7350"
      DATABASE_URL: postgres://breachpoint:breachpoint@postgres:5432/breachpoint
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]

  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./client/build/web:/usr/share/nginx/html:ro
      - ./client/build/web-threaded:/usr/share/nginx/html/threaded:ro
      - ./docker/web.nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: breachpoint
      POSTGRES_PASSWORD: breachpoint
      POSTGRES_DB: breachpoint
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
