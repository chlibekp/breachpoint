# Local development stack (spec 14.5): game gateway + match workers + HTTP API (one Node process),
# Postgres, Redis and nginx for the browser build (run tools/export-web.sh first).
# Change JWT_SECRET / TICKET_SECRET for anything beyond local testing.
services:
  gateway:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports: ["7350:7350", "7351:7351"]
    environment:
      PORT: "7350"
      API_PORT: "7351"
      DATABASE_URL: postgres://breachpoint:breachpoint@postgres:5432/breachpoint
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-secret-change-me
      PUBLIC_GATEWAY_URL: ws://localhost:7350
      MAP: solstice,neon
      REPLAY_DIR: /data/replays
      METRICS_PORT: "9464"
    volumes: [replays:/data/replays]
    depends_on: [postgres, redis]

  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./client/build/web:/usr/share/nginx/html:ro
      - ./client/build/web-threaded:/usr/share/nginx/html/threaded:ro
      - ./docker/web.nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: breachpoint
      POSTGRES_PASSWORD: breachpoint
      POSTGRES_DB: breachpoint
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Observability (spec 14.5): Prometheus scrapes gateway:9464; Grafana on :3000 (admin/admin locally)
  # with the BREACHPOINT dashboard provisioned. The metrics port is not published to the host.
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [gateway]

  grafana:
    image: grafana/grafana:11.3.1
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pgdata:
  replays:
