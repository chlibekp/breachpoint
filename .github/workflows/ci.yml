name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "4.7-stable"

jobs:
  node:
    name: Lint, types, tests, generated-code drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:config
      - run: npm test
      # Fails if the protocol codecs or the client's mirrored data are out of date.
      - run: npm run check:generated

  godot:
    name: Godot tests and exports
    runs-on: ubuntu-24.04
    needs: node
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned engine version
        run: test "$(cat .godot-version)" = "${GODOT_VERSION}.stable"
      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-v1
      - name: Download Godot + templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          base=https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}
          curl -sSfL -o /tmp/godot.zip $base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot
          curl -sSfL -o /tmp/tpl.tpz $base/Godot_v${GODOT_RELEASE}_export_templates.tpz
          unzip -qj /tmp/tpl.tpz 'templates/linux_*.x86_64' 'templates/web_*' 'templates/windows_*_x86_64.exe' 'templates/version.txt' \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Set GODOT_BIN
        run: echo "GODOT_BIN=$HOME/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: timeout 600 bash tools/godot.sh --headless --path client --import
      - name: GDScript tests (protocol parity, config schemas, quality tiers)
        run: bash tools/godot.sh --headless --path client -s res://tests/run_tests.gd
      - name: Export Linux + Web + Windows
        run: bash tools/export.sh Linux Web Windows
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: client/build/
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    needs: node
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/server.Dockerfile -t breachpoint/server:ci .
